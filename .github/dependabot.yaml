version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"

    - package-ecosystem: "npm"
      directory: "/apps/backend"
      schedule:
          interval: "monthly"
      groups:
          nestjs:
              patterns:
                  - "@nestjs/*"
          prisma:
              patterns:
                  - "prisma"
                  - "@prisma/*"
          jest:
              patterns:
                  - "jest"
                  - "ts-jest"
                  - "@types/jest"

    - package-ecosystem: "npm"
      directory: "/apps/frontend"
      schedule:
          interval: "monthly"
      groups:
          react-stack:
              patterns:
                  - "react*"
                  - "@types/react*"
          tailwind:
              patterns:
                  - "tailwind*"
                  - "@tailwindcss/*"
