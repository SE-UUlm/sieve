version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "sunday"
          time: "16:00"

      labels:
          - "dependencies"
          - "github-actions"

      commit-message:
          prefix: "chore"
          include: "scope"

      groups:
          github-actions:
              patterns:
                  - "*"

    - package-ecosystem: "npm"
      directory: "/apps/frontend"
      schedule:
          interval: "weekly"
          day: "sunday"
          time: "16:00"

      versioning-strategy: "increase"
      open-pull-requests-limit: 10

      cooldown:
          semver-major-days: 7
          semver-minor-days: 3
          semver-patch-days: 1

      labels:
          - "dependencies"
          - "frontend"

      commit-message:
          prefix: "chore"
          include: "scope"

      groups:
          nextjs:
              patterns:
                  - "next"
                  - "react"
                  - "react-dom"

          data-layer:
              patterns:
                  - "@tanstack/*"

          forms-and-validation:
              patterns:
                  - "react-hook-form"
                  - "@hookform/*"
                  - "zod"

          ui-libraries:
              patterns:
                  - "@radix-ui/*"
                  - "radix-ui"
                  - "lucide-react"
                  - "sonner"
                  - "next-themes"
                  - "class-variance-authority"
                  - "clsx"
                  - "tailwind-merge"

          dev-tooling:
              dependency-type: "development"
              patterns:
                  - "*"

    - package-ecosystem: "npm"
      directory: "/apps/backend"
      schedule:
          interval: "monthly"
      groups:
          nestjs:
              patterns:
                  - "@nestjs/*"
          prisma:
              patterns:
                  - "prisma"
                  - "@prisma/*"
          jest:
              patterns:
                  - "jest"
                  - "ts-jest"
                  - "@types/jest"
