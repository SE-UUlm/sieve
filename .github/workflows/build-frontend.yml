name: Build Frontend

on:
    push:
        branches:
            - main
            - develop
    pull_request:

env:
    node_version: ${{ vars.NODE_VERSION_FRONTEND }}
    working_directory: apps/frontend
    backend_node_version: ${{ vars.NODE_VERSION_BACKEND }}
    backend_working_directory: apps/backend
    cache-dependency-path: apps/frontend/pnpm-lock.yaml

jobs:
    build:
        name: Build Frontend
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Setup Backend Environment
              uses: ./.github/workflows/setup-node-pnpm/
              with:
                  node_version: ${{ env.backend_node_version }}
                  working-directory: ${{ env.backend_working_directory }}

            - name: Generate API Clients
              run: pnpm run generate:clients
              working-directory: ${{ env.backend_working_directory }}
              env:
                  DB_USERNAME: postgres
                  DB_PASSWORD: postgres
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_NAME: postgres

            - name: Setup Frontend Environment
              uses: ./.github/workflows/setup-node-pnpm/
              with:
                  node_version: ${{ env.node_version }}
                  working-directory: ${{ env.working_directory }}
                  cache-dependency-path: ${{ env.cache-dependency-path }}

            - uses: actions/cache@v6
              with:
                  path: apps/frontend/.next/cache
                  # Generate a new cache whenever packages or source files change.
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/frontend/pnpm-lock.yaml') }}-${{ hashFiles('apps/frontend/**/*.js', 'apps/frontend/**/*.jsx', 'apps/frontend/**/*.ts', 'apps/frontend/**/*.tsx') }}
                  # If source files changed but packages didn't, rebuild from a prior cache.
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('apps/frontend/pnpm-lock.yaml') }}-

            - name: Build Application
              run: pnpm run build
              working-directory: ${{ env.working_directory }}

            - name: Archive Build Artifacts
              uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: Frontend Build Artifact
                  path: apps/frontend/.next
                  include-hidden-files: true
                  if-no-files-found: error
