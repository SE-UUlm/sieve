name: Build and Publish Docker Image

env:
    REGISTRY: ghcr.io

on:
    workflow_call:
        inputs:
            context:
                description: The directory the Dockerfile should be executed in
                required: true
                type: string
            image-name:
                description: The name of the image to build
                required: true
                type: string

jobs:
    build-and-publish-docker-image:
        name: Build and Publish Docker Image
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6

            - name: Set Up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set Up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # Only push artifacts on the develop branch or on a new tag
            - name: Determine If Artifacts Should Be Pushed To The Registry
              id: check-push
              run: |
                  echo "should-push=${{ github.ref_type == 'tag' || (github.ref_type == 'branch' && github.ref_name == 'develop') }}" >> $GITHUB_OUTPUT
            - name: Login to GitHub Container Registry
              if: steps.check-push.outputs.should-push == 'true'
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # This step uses metadata-action to extract tags and labels that will be
            # applied to the specified image. The `id` "meta" allows the output of
            # this step to be referenced in a subsequent step. The `images` value
            # provides the base name for the tags and labels.
            # We add the following tags
            # - version tags: for v1.2.3 -> v1, v1.2, v1.2.3
            # - latest tags: for develop -> latest
            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ inputs.image-name }}
                  tags: |
                      type=semver,pattern=v{{version}},enable=${{ github.ref_type == 'tag' }}
                      type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
                      type=semver,pattern=v{{major}},enable=${{ github.ref_type == 'tag' }}
                      type=raw,value=latest,enable=${{ github.ref_name == 'develop' }}
                  flavor: |
                      latest=false

            - name: Build and Push Docker Image
              id: push
              uses: docker/build-push-action@v7
              with:
                  context: ${{ inputs.context }}
                  file: ${{ inputs.context }}/Dockerfile
                  push: ${{ steps.check-push.outputs.should-push == 'true' }}
                  # Only build for ARM when we intend to publish the image, as the emulation takes a lot of time
                  platforms: ${{ steps.check-push.outputs.should-push == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

            - name: Generate Artifact Attestation for Docker Image
              if: steps.check-push.outputs.should-push == 'true'
              uses: actions/attest-build-provenance@v4
              with:
                  subject-name: ${{ env.REGISTRY }}/${{ inputs.image-name }}
                  subject-digest: ${{ steps.push.outputs.digest }}
                  push-to-registry: true
