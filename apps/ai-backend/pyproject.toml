[project]
name = "ai-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Moritz Beck (Birkenstab)", email = "git@birkenstab.de"}
]
readme = { text = "AI-backend service for the SIEVE project.", content-type = "text/markdown" }
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]>=0.128.0,<0.136.0",
    "langchain>=1.3.14,<2.0.0",
    "langchain-openai>=1.1.14,<2.0.0",
    "langchain-google-vertexai>=3.2.2",
    "langchain-anthropic>=1.3.5",
    "python-dotenv>=1.2.1,<2.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "asyncpg>=0.31.0",
    "langgraph>=1.0.7",
]

[project.scripts]
dev = "tasks:dev"
test = "tasks:test"
lint = "tasks:lint"
format = "tasks:format"
typecheck = "tasks:typecheck"
build_graphs = "build_graphs:build_graphs"
evaluate = "tasks:evaluate"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]
