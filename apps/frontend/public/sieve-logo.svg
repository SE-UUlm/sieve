<svg
    width="40"
    height="40"
    viewBox="0 0 40 40"
    xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow
                dx="0"
                dy="6"
                stdDeviation="6"
                flood-color="#1e3a8a"
                flood-opacity="0.2"
            />
        </filter>
    </defs>

    <rect
        x="0"
        y="0"
        width="40"
        height="40"
        rx="8"
        ry="8"
        fill="#2563EB"
