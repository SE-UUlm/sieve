    <text
        x="20"
        y="20"
        text-anchor="middle"
        dominant-baseline="central"
        fill="#ffffff"
        font-size="20"
        font-weight="700"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    >
        S
    </text>
</svg>
